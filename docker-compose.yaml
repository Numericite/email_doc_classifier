services:
  assistant:
    env_file:
      - .env.docker
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email_doc_classifier_assistant

    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/classifier

  postgres:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: classifier
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  
volumes:
   postgres_data: